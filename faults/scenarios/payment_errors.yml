id: payment_errors
title: Payment provider fails most charges with HTTP 500
alert: >-
  Checkout errors: more than 5% of POST /orders requests have failed with 5xx over the last 2 minutes.
ground_truth:
  category: dependency_errors
  component: payment-provider
  key_evidence:
    - shop-api logs "payment provider returned an error" with provider_status 500
    - 'payment-provider logs "charge failed: card processor unavailable"'
    - most payment-provider /charge requests return HTTP 500
inject:
  - type: http
    service: payment-provider
    method: PUT
    path: /_faults
    json: {error_rate: 0.8}
recover:
  - type: http
    service: payment-provider
    method: DELETE
    path: /_faults
signals:
  - description: the provider returns 500 on /charge
    source: prometheus
    query: 'sum(rate(http_requests_total{job="payment-provider",route="/charge",status="500"}[30s]))'
    op: ">"
    value: 0.3
  - description: shop-api logs provider errors
    source: loki
    query: 'sum(count_over_time({service="shop-api"} |= "payment provider returned an error" [30s]))'
    op: ">="
    value: 5
  - description: the provider logs why charges fail
    source: loki
    query: 'sum(count_over_time({service="payment-provider"} |= "card processor unavailable" [30s]))'
    op: ">="
    value: 5
