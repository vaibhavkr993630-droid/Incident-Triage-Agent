id: missing_index
title: Missing index on the product-stats query
alert: >-
  shop-api latency: p95 latency of GET /products/{product_id}/stats has been above 50 ms
  for the last 2 minutes (it is normally under 10 ms).
ground_truth:
  category: db_slow_query
  component: postgres
  key_evidence:
    - shop-api logs "slow database query" warnings for the product_stats query
    - only the /products/{product_id}/stats route is slow; other routes and error rates are normal
    - db_query_duration_seconds for product_stats rose from under 5 ms to 50-100 ms
inject:
  - type: sql
    statement: DROP INDEX IF EXISTS ix_orders_product_created
recover:
  - type: sql
    statement: CREATE INDEX IF NOT EXISTS ix_orders_product_created ON orders (product_id, created_at)
signals:
  - description: p95 latency of the stats route is above 50 ms
    source: prometheus
    query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="shop-api",route="/products/{product_id}/stats"}[30s])))'
    op: ">"
    value: 0.05
  - description: shop-api logs slow product_stats queries
    source: loki
    query: 'sum(count_over_time({service="shop-api"} |= "slow database query" | json | query="product_stats" [30s]))'
    op: ">="
    value: 3
  - description: no 5xx errors (the fault slows requests, it does not break them)
    source: prometheus
    query: 'sum(rate(http_requests_total{job="shop-api",status=~"5.."}[30s]))'
    op: "<"
    value: 0.05
