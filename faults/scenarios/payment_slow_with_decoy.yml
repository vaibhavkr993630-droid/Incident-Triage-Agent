id: payment_slow_with_decoy
title: Slow payment provider, hidden behind loud unrelated warnings and a recent change
alert: >-
  Checkout errors: more than 5% of POST /orders requests have failed with 5xx over the last 2 minutes.
ground_truth:
  category: dependency_slow
  component: payment-provider
  key_evidence:
    - shop-api logs "payment provider timed out" with timeout_s 2.0 (the normal setting)
    - the payment provider's own /charge latency rose to about 3 s
    - the deprecated-header warnings and the recent shop-api logging change are unrelated to payments
inject:
  - type: http
    service: shop-api
    method: POST
    path: /_changes
    json:
      service: shop-api
      kind: config
      summary: Warn on requests that send the deprecated X-Client-Version header
      details: {setting: WARN_DEPRECATED_HEADERS, old: "false", new: "true"}
  - type: http
    service: shop-api
    method: PUT
    path: /_faults
    json: {decoy_warnings: true}
  - type: http
    service: payment-provider
    method: PUT
    path: /_faults
    json: {latency_ms: 3000}
recover:
  - type: http
    service: payment-provider
    method: DELETE
    path: /_faults
  - type: http
    service: shop-api
    method: DELETE
    path: /_faults
  - type: sql
    statement: DELETE FROM changes WHERE source = 'scenario'
signals:
  - description: payment calls time out
    source: prometheus
    query: 'sum(rate(payment_requests_total{job="shop-api",outcome="timeout"}[30s]))'
    op: ">"
    value: 0.2
  - description: the provider's own /charge latency is high
    source: prometheus
    query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="payment-provider",route="/charge"}[30s])))'
    op: ">"
    value: 1
  - description: the decoy warnings are loud
    source: loki
    query: 'sum(count_over_time({service="shop-api"} |= "deprecated header" [30s]))'
    op: ">="
    value: 20
