id: no_fault
title: Control - nothing is wrong
alert: >-
  A customer said the shop "felt slow earlier today". No alert has fired.
ground_truth:
  category: no_fault
  component: none
  key_evidence:
    - error rates, latencies, queue depth and dependency health are all normal
settle_seconds: 0
signals:
  - description: no 5xx errors
    source: prometheus
    query: 'sum(rate(http_requests_total{job="shop-api",status=~"5.."}[30s]))'
    op: "<"
    value: 0.05
  - description: shop-api p95 latency is low across all routes
    source: prometheus
    query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="shop-api"}[30s])))'
    op: "<"
    value: 0.25
  - description: the fulfillment queue is drained
    source: prometheus
    query: 'max(worker_queue_depth{job="worker"})'
    op: "<"
    value: 5
  - description: no error-level log lines
    source: loki
    query: 'sum(count_over_time({service=~"shop-api|payment-provider|worker", level="error"} [30s]))'
    op: "<"
    value: 1
