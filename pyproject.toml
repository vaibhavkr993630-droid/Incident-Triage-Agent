[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "Agentic incident triage: investigates service failures from logs, metrics and runbooks, and reports the root cause with evidence."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vaibhav Kumar" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
