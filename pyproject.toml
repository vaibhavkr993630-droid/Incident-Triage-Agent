[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "Agentic incident triage: investigates service failures from logs, metrics and runbooks, and reports the root cause with evidence."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vaibhav Kumar" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.11",
]
# Runtime dependencies of the lab services (the system under investigation).
# Kept apart from the agent's own dependencies; the lab Docker image installs only this group.
lab = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.34",
]

[tool.uv]
# Local development and CI get both groups; the lab image installs only `lab`.
default-groups = ["dev", "lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need the Docker stack running; run them with `pytest -m integration`.
addopts = "-q -m 'not integration'"
markers = ["integration: needs the lab stack running (docker compose up)"]
