# Prometheus scrapes every lab service. The job name is the service name, so queries can
# filter by {job="shop-api"} with the same names the logs use.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shop-api
    static_configs:
      - targets: ["shop-api:8000"]
  - job_name: payment-provider
    static_configs:
      - targets: ["payment-provider:8001"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
